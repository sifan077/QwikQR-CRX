<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <title>QwikQR</title>
    <script src="qrcode.min.js"></script>
    <script src="jsQR.min.js"></script>
</head>
<body>
    <div class="popup-wrapper">
        <div class="container">
            <div class="input-section">
                <input type="text" id="text-input" placeholder="输入要生成二维码的内容">
                <div class="paste-hint" id="paste-hint">📋 Ctrl+V 粘贴二维码图片识别</div>
            </div>

            <div class="qr-section">
                <div id="qrcode"></div>
                <div class="decode-result" id="decode-result" style="display: none;">
                    <div class="decode-result-label">识别结果</div>
                    <div class="decode-result-text" id="decode-result-text"></div>
                    <div class="decode-result-actions">
                        <button id="decode-copy-btn" class="action-btn copy-btn">📋 复制</button>
                        <button id="decode-open-btn" class="action-btn open-btn" style="display: none;">🔗 打开链接</button>
                    </div>
                </div>
                <div class="button-section">
                    <button id="copy-btn" class="action-btn copy-btn">📋 复制</button>
                    <button id="download-btn" class="action-btn download-btn">💾 下载</button>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <button id="settings-btn" class="settings-btn" title="设置">⚙️</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
